<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#EDE3CF">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101E18">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="Rayana Coffees' social media plan: this week, the pipeline, the feed, references and platform guides.">
  <title>Rayana Social Hub</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&family=Libre+Baskerville:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <div class="layout">
    <nav class="rail" id="rail" aria-label="Main" hidden>
      <a class="wordmark" href="#/week" aria-label="Rayana Social Hub, this week">
        <span class="wm-name">Rayana</span><span class="wm-sub">Social Hub</span>
      </a>
      <div class="tabs">
        <a class="tab" href="#/week" data-route="week"><i class="ph ph-calendar-blank" aria-hidden="true"></i><span>Week</span></a>
        <a class="tab" href="#/pipeline" data-route="pipeline"><i class="ph ph-kanban" aria-hidden="true"></i><span>Pipeline</span></a>
        <a class="tab" href="#/feed" data-route="feed"><i class="ph ph-grid-nine" aria-hidden="true"></i><span>Feed</span></a>
        <a class="tab" href="#/references" data-route="references"><i class="ph ph-bookmark-simple" aria-hidden="true"></i><span>References</span></a>
        <a class="tab" href="#/guides" data-route="guides"><i class="ph ph-book-open-text" aria-hidden="true"></i><span>Guides</span></a>
      </div>
      <button class="add-btn" id="add-btn" type="button" aria-label="Add a reference, idea or post" hidden><i class="ph ph-plus" aria-hidden="true"></i><span>Add</span></button>
    </nav>
    <div class="col">
      <header class="band" id="band">
        <div class="mast">
          <a class="mast-name" href="#/week">Rayana <span>Social Hub</span></a>
          <span class="sync" id="sync" role="status" aria-live="polite" hidden><span class="txt"></span></span>
          <a class="band-btn" href="#/settings" id="settings-link" aria-label="Settings" hidden><i class="ph ph-gear-six" aria-hidden="true"></i></a>
        </div>
        <div class="band-body" id="band-body"></div>
      </header>
      <main id="view" tabindex="-1">
        <div class="skel-list" aria-hidden="true"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
      </main>
    </div>
  </div>
  <noscript><p style="padding:16px">The hub needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
